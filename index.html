const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:250000,hash:'SHA-256'},b,{name:'AES-GCM',length:256},false,['decrypt']);
  const t=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c)));
  try{localStorage.setItem('gdb-pw',pw)}catch(e){}
  document.open();document.write(t);document.close();
}
document.getElementById('f').onsubmit=async e=>{e.preventDefault();
  try{await open_(document.getElementById('pw').value.trim())}
  catch(x){document.getElementById('err').textContent='Senha errada / Wrong password';}};
let saved=null;try{saved=localStorage.getItem('gdb-pw')}catch(e){}
